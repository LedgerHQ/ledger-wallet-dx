#
# This playbook installs tools a developer need to work on Ledger products
#

---
- hosts: localhost
  gather_facts: no
  connection: local

  vars:
    vscode_extensions:
      - {
          name: "Markdown Preview Enhanced",
          id: "shd101wyy.markdown-preview-enhanced",
        }
      - { name: "ESLint", id: "dbaeumer.vscode-eslint" }
      - { name: "Prettier - Code formatter", id: "esbenp.prettier-vscode" }
      - { name: "Live Share", id: "MS-vsliveshare.vsliveshare" }
    mise_tools:
      - { name: "node", version: "24.14.0" }
      - { name: "pnpm", version: "10.24.0" }
      - { name: "ruby", version: "3.3.7" }

  vars_prompt:
    - name: zsh
      prompt: "Install Oh-my-zsh/Antigen ?"
      default: "yes"
      private: no
    - name: sublime
      prompt: "Install Sublime Text ?"
      default: "yes"
      private: no
    - name: vscode
      prompt: "Install VSCode ?"
      default: "yes"
      private: no
    - name: cursor
      prompt: "Install Cursor ?"
      default: "yes"
      private: no
    - name: xcode
      prompt: "Install xcode ?"
      default: "yes"
      private: no
    - name: androidStudio
      prompt: "Install Android Studio ?"
      default: "yes"
      private: no

  tasks:
    - name: "Install Oh-my-zsh/Antigen"
      when: zsh|bool
      ansible.builtin.shell:
        cmd: curl -L git.io/antigen > ~/antigen.zsh

    - name: "Copy .zshrc file"
      when: zsh|bool
      template:
        src: files/zsh/.zshrc
        dest: ~/.zshrc

    - name: "Install Sublime Merge"
      when: sublime|bool
      community.general.homebrew_cask:
        name: "{{ item }}"
      with_items:
        - sublime-merge

    - name: "Install VSCode"
      when: vscode|bool
      community.general.homebrew_cask:
        name: "{{ item }}"
      with_items:
        - visual-studio-code

    - name: "Install VSCode extensions"
      when: vscode|bool
      command: code --install-extension {{ item.id | default(item) }}
      with_items: "{{ vscode_extensions }}"
      register: vscode_result
      changed_when: "'already installed' not in vscode_result.stdout"

    - name: Install Cursor
      when: cursor|bool
      community.general.homebrew_cask:
        name: "{{ item }}"
      with_items:
        - cursor

    - name: Installing brew cask packages
      community.general.homebrew_cask:
        name: "{{ item }}"
      with_items:
        - postman
        - drawio
        - android-file-transfer
        - ledger-live
        - utm
        - zulu@17
        - insomnia

    - name: Installing brew packages
      community.general.homebrew:
        name: "{{ item }}"
      with_items:
        - mise
        - scrcpy
        - git-lfs
        - ios-deploy
        - wget
        - unzip
        - gzip
        - xz
        - openjdk@17

    - name: Installing Android Studio
      when: androidStudio|bool
      community.general.homebrew_cask:
        name: android-studio

    - name: Installing and selecting Xcode 16.2
      when: xcode|bool
      ansible.builtin.shell:
        cmd: xcodes install 16.2 --select

    - name: Configuring mise to use precompiled Ruby binaries
      ansible.builtin.shell:
        cmd: mise settings set ruby.compile false

    - name: Installing default development tool versions
      ansible.builtin.shell:
        cmd: mise use --global {{ item.name }}@{{ item.version }}
      with_items: "{{ mise_tools }}"

    - name: Installing bundler - consistent environment for Ruby projects
      ansible.builtin.shell:
        cmd: mise exec ruby@3.3.7 -- gem install bundler --version 2.5.7

    - name: Installing fastlane - tool to automate tedious tasks like releasing app for example
      ansible.builtin.shell:
        cmd: mise exec ruby@3.3.7 -- gem install fastlane --version 2.228.0

    - name: Installing Xcode plugin for kotlin
      ansible.builtin.shell:
        cmd: brew install xcode-kotlin

    - name: Installing xcode-kotlin
      ansible.builtin.shell:
        cmd: xcode-kotlin install